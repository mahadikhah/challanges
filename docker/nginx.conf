# nginx front door for the Challenges platform.
#
# Mirrors the hand-written server block in docs/setup-vps.md §4, with two
# container-specific differences:
#   - PHP goes to the `app` service over TCP (fastcgi_pass app:9000) instead of
#     a local php-fpm unix socket.
#   - TLS is not handled here. The Caddy edge (deploy/edge/) terminates HTTPS and
#     forwards cleartext to this port 80, so certificates live in exactly one place.
#
# The document root path must match the app container's, because SCRIPT_FILENAME
# is resolved by php-fpm on the *other* side of fastcgi_pass. Both images put the
# application at /var/www/html.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Voice/photo proof uploads. Keep in step with PHP's upload_max_filesize
    # in docker/php.ini — nginx rejects first, and a mismatch shows up as a
    # confusing 413 instead of a validation error.
    client_max_body_size 20m;

    # Trust the edge's forwarded client address. Caddy sets X-Forwarded-For;
    # Laravel reads it via TrustProxies.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;
    real_ip_recursive on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Immutable Vite output: hashed filenames, safe to cache hard.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Proof uploads and Telegram webhook bursts are slower than a page render.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Hide dotfiles, but keep ACME's well-known path reachable.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
