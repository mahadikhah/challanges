; Production PHP settings for the Challenges platform.
; Loaded as conf.d/zz-app.ini so it wins over earlier conf.d entries.

[PHP]
memory_limit = 512M

; Proof media: voice notes and photos. Keep in step with nginx's
; client_max_body_size (docker/nginx.conf) — nginx rejects first.
upload_max_filesize = 20M
post_max_size = 24M

max_execution_time = 120

expose_php = Off

[opcache]
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; The code in an image never changes under a running container, so skip the
; stat() on every include. A deploy replaces the container, not the files.
opcache.validate_timestamps = 0
